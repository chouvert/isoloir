# Sources de la veille quotidienne (scripts/veille.mjs, branche `veille`).
# type : rss | page | sitemap | programme — categorie : campagne | parti | presse | sondages | institution
# candidats : transverse, ou liste d'identifiants de fiches (rattachement automatique).
# Programmes (spec docs/superpowers/specs/2026-11-15-suivi-programmes-design.md) :
#   type programme : `url` = point d'entrée (programme_url de la fiche) ; `prefixes` = chemins suivis sur le même
#     site (défaut : dossier du point d'entrée) ; `plan` = plan du site facultatif, filtré par les préfixes.
#     Empreinte du texte de chaque page comparée chaque jour (empreintes.json) ; candidats obligatoires.
#     `ignorer` : expressions (insensibles à la casse) ; un bloc de texte qui en contient une est écarté de
#     l'empreinte (compteurs, encarts d'actualité). `max_pages` : plafond propre à la source (défaut 120).
#     Un bloc présent sur plusieurs pages de la source est compté une fois (« blocs communs modifiés »).
#   `motifs` (source sitemap) : seules les adresses nouvelles dont le chemin contient un motif sont gardées,
#     comme « Programme : page apparue » (candidats sans programme publié).
#   Adresses des sources programme et à motifs non éprouvées au 2026-11-15 : essai par
#     `gh workflow run veille.yml -f essai=true`.
# Les sources campagne, parti et sondages sont gardées sans filtre ; les autres seulement si elles citent
# un candidat ou un mot-clé de veille/mots-cles.yml.
#
# Adresses non éprouvées au 2026-11-07 (le poste de développement ne joint pas ces sites) :
# le premier lancement du workflow les met à l'épreuve ; corriger ou retirer celles en échec
# et noter ici les sites sans flux.
# Premier lancement (2026-11-07) : 16 sources sur 19 en succès. En échec, remplacées par des pages
# de presse dédiées : place-publique.eu/feed/, rassemblementnational.fr/actualites, www.pcf.fr.
# Wikipédia écartée : son robots.txt interdit /w/ (flux de l'historique) ; sondages suivis par la
# Commission des sondages et la presse.

