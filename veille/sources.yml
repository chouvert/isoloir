# Sources de la veille quotidienne (scripts/veille.mjs, branche `veille`).
# type : rss | page | sitemap — categorie : campagne | parti | presse | sondages | institution
# candidats : transverse, ou liste d'identifiants de fiches (rattachement automatique).
# Les sources campagne, parti et sondages sont gardées sans filtre ; les autres seulement si elles citent
# un candidat ou un mot-clé de veille/mots-cles.yml.
#
# Adresses non éprouvées au 2026-11-07 (le poste de développement ne joint pas ces sites) :
# le premier lancement du workflow les met à l'épreuve ; corriger ou retirer celles en échec
# et noter ici les sites sans flux.
# Premier lancement (2026-11-07) : 16 sources sur 19 en succès. En échec, remplacées par des pages
# de presse dédiées : place-publique.eu/feed/, rassemblementnational.fr/actualites, www.pcf.fr.
# Wikipédia écartée : son robots.txt interdit /w/ (flux de l'historique) ; sondages suivis par la
# Commission des sondages et la presse.

