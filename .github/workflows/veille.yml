name: Veille quotidienne

# Collecte l'actualité des candidats et l'écrit sur la branche `veille` (jamais fusionnée dans main).
# Spec : docs/superpowers/specs/2026-11-07-veille-hebdomadaire-design.md
on:
  schedule:
    - cron: '0 5 * * *'   # 6 h à Paris en hiver, 7 h en été
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Branche veille
        run: |
          git config user.name "isoloir-veille"
          git config user.email "isoloir-veille@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin veille >/dev/null; then
            git fetch --depth 1 origin veille
            git worktree add veille-donnees FETCH_HEAD
            git -C veille-donnees switch -c veille
          else
            git worktree add --orphan -b veille veille-donnees
          fi

      - name: Collecte
        run: node scripts/veille.mjs --sortie veille-donnees

      - name: Publication sur la branche veille
        run: |
          cd veille-donnees
          git add -A
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -q -m "Veille $(date -u +%F)"
          git push origin HEAD:veille
